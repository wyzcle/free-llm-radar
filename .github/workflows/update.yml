name: update

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install .

      - name: Run radar
        run: python -m radar --data-dir data

      - name: Commit if changed
        run: |
          git config user.name "radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/
          if git diff --cached --quiet; then
            echo "No changes, skip commit"
          else
            git commit -m "radar: refresh $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
